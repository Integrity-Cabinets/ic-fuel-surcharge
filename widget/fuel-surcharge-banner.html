  Integrity Cabinets - Fuel Surcharge, Lead Times & Announcements banner
  Paste this whole file into a Squarespace Code Block (Display Source OFF).
  Change only the DATA_URL line below if your GitHub account or repository name differs.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<section id="icfs" class="icfs" aria-labelledby="icfs-title">
  <div class="icfs-ann" id="icfs-ann" hidden></div>
  <div class="icfs-rate">
    <h2 id="icfs-title" class="icfs-label">Current Fuel Surcharge</h2>
    <p class="icfs-value" id="icfs-value" role="status" aria-live="polite">Loading&hellip;</p>
    <p class="icfs-dates" id="icfs-dates"></p>
    <p class="icfs-flag" id="icfs-flag" hidden></p>
  </div>

  <div class="icfs-lead" id="icfs-lead" hidden>
    <h3 class="icfs-label">Current Lead Times <span id="icfs-lead-asof"></span></h3>
    <dl class="icfs-lead-list" id="icfs-lead-list"></dl>
  </div>

  <p class="icfs-foot" id="icfs-foot" hidden>
    <span id="icfs-basis"></span>
    Updated every Monday from the most recent U.S. diesel average the EIA published before that Monday. Applies to orders placed during the week shown.
    <a href="https://www.eia.gov/petroleum/gasdiesel/" target="_blank" rel="noopener">EIA Gasoline and Diesel Fuel Update<span class="icfs-sr"> (opens in a new tab)</span></a>
  </p>
</section>

<style>
  .icfs, .icfs * { box-sizing: border-box; }
  .icfs [hidden] { display: none !important; }
  .icfs {
    --icfs-accent: #c9975b; --icfs-cream: #f3e9d6; --icfs-muted: #c4b49c;
    display: grid; grid-template-columns: minmax(270px, 0.9fr) 2fr; gap: 0 32px;
    max-width: 960px; margin: 0 auto; padding: 20px 28px 16px;
    background: rgba(36, 26, 18, 0.92); border: 1px solid rgba(201, 151, 91, 0.35); border-left: 3px solid var(--icfs-accent);
    color: var(--icfs-cream); font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; text-align: left;
  }
  .icfs p, .icfs h2, .icfs h3, .icfs dl, .icfs dd, .icfs dt { margin: 0; padding: 0; }
  .icfs-label {
    font: 600 11px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--icfs-accent);
  }
  .icfs-label span { color: var(--icfs-muted); letter-spacing: 0.06em; text-transform: none; font-weight: 400; }
  .icfs-value { font-size: 52px; font-weight: 600; line-height: 1.05; color: #fff8ea; margin-top: 4px !important; }
  .icfs-value.icfs-small { font-size: 21px; line-height: 1.3; margin-top: 8px !important; }
  .icfs-dates { font-size: 19px; color: var(--icfs-cream); }
  .icfs-flag {
    display: inline-block; margin-top: 8px !important; padding: 3px 8px; border: 1px solid var(--icfs-accent);
    font: 600 11px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.04em; color: #ffe2b8;
  }
  .icfs-lead { border-left: 1px solid rgba(201, 151, 91, 0.3); padding-left: 32px; }
  .icfs-lead-list { margin-top: 8px !important; }
  .icfs-lead-list div { display: grid; grid-template-columns: 11.5em 1fr; gap: 12px; padding: 5px 0; border-bottom: 1px solid rgba(243, 233, 214, 0.12); }
  .icfs-lead-list div:last-child { border-bottom: 0; }
  .icfs-lead-list dt { font-size: 18px; color: var(--icfs-muted); }
  .icfs-lead-list dd { font-size: 19px; font-weight: 600; color: #fff8ea; }
  .icfs-lead-note { font-size: 18px; color: var(--icfs-cream); margin-top: 8px !important; }
  .icfs-ann { grid-column: 1 / -1; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(243, 233, 214, 0.15); }
  .icfs-ann p { font-size: 19px; line-height: 1.35; color: #fff8ea; margin-top: 4px !important; }
  .icfs-ann p + p { margin-top: 8px !important; }
  .icfs-foot {
    grid-column: 1 / -1; margin-top: 14px !important; padding-top: 10px !important; border-top: 1px solid rgba(243, 233, 214, 0.15);
    font: 400 12px/1.55 "Helvetica Neue", Arial, sans-serif; color: var(--icfs-muted);
  }
  .icfs-foot a { color: #e3b67c; text-decoration: underline; white-space: nowrap; }
  .icfs-foot a:hover, .icfs-foot a:focus { color: #fff8ea; }
  .icfs-foot a:focus-visible { outline: 2px solid #fff8ea; outline-offset: 2px; }
  .icfs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 700px) {
    .icfs { grid-template-columns: 1fr; padding: 18px 18px 14px; }
    .icfs-lead { border-left: 0; padding-left: 0; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(201, 151, 91, 0.3); }
    .icfs-lead-list div { grid-template-columns: 1fr; gap: 0; }
    .icfs-value { font-size: 46px; }
    .icfs-foot a { white-space: normal; }
  }
</style>

<script>
(function () {
  // ---- The only setting: where the saved weekly data lives. ----
  var DATA_URL = 'https://raw.githubusercontent.com/Integrity-Cabinets/ic-fuel-surcharge/main/data/';
  var PHONE = '256-354-1431';
  var REFRESH_MINUTES = 15;

  var demo = window.IC_FUEL_DEMO || null; // set only by the local preview page
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var state = { records: null, lead: null, ann: null };
  var switchTimer = null;

  function parts(d) { var p = String(d).split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
  function longDate(d) { var p = parts(d); return MONTHS[p.m - 1] + ' ' + p.d + ', ' + p.y; }
  function range(a, b) {
    var s = parts(a), e = parts(b);
    if (s.y !== e.y) return longDate(a) + ' – ' + longDate(b);
    if (s.m !== e.m) return MONTHS[s.m - 1] + ' ' + s.d + ' – ' + MONTHS[e.m - 1] + ' ' + e.d + ', ' + e.y;
    return MONTHS[s.m - 1] + ' ' + s.d + ' – ' + e.d + ', ' + e.y;
  }
  function validRecord(r) {
    return r && /^\d{4}-\d{2}-\d{2}$/.test(r.weekStart) && /^\d{4}-\d{2}-\d{2}$/.test(r.displayEnd) &&
      /^\d{1,2}\.\d{2}$/.test(r.surchargePercent) && !isNaN(Date.parse(r.effectiveStart)) && !isNaN(Date.parse(r.effectiveEnd));
  }
  function todayCentral(now) {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now); }
    catch (e) { return new Date(now).toISOString().slice(0, 10); }
  }
  function daysBetween(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function show(el, on) { el.hidden = !on; }

  function render() {
    var now = demo && demo.now ? new Date(demo.now) : new Date();
    var value = $('icfs-value'), dates = $('icfs-dates'), flag = $('icfs-flag'), foot = $('icfs-foot');
    var good = (state.records || []).filter(validRecord);
    var current = null, lastPast = null;
    good.forEach(function (r) {
      var start = Date.parse(r.effectiveStart), end = Date.parse(r.effectiveEnd);
      if (start <= now && now < end) current = r;
      else if (end <= now && (!lastPast || r.weekStart > lastPast.weekStart)) lastPast = r;
    });
    var shown = current || lastPast;

    if (!shown) {
      value.textContent = state.records === null ? 'Loading…' : 'Fuel surcharge unavailable — contact Integrity Cabinets.';
      value.className = 'icfs-value icfs-small';
      dates.textContent = state.records === null ? '' : PHONE;
      show(flag, false); show(foot, false);
    } else {
      value.textContent = shown.surchargePercent + '%';
      value.className = 'icfs-value';
      dates.textContent = (current ? 'Effective ' : 'Was effective ') + range(shown.weekStart, shown.displayEnd);
      var flags = [];
      if (demo) flags.push('Demo — sample data, not a live rate');
      if (!current) flags.push('This week’s rate is pending — contact Customer Service, ' + PHONE);
      flag.textContent = flags.join(' · ');
      show(flag, flags.length > 0);
      var b = shown.benchmark;
      $('icfs-basis').textContent = b && b.priceDollarsPerGallon
        ? 'Based on the EIA U.S. on-highway diesel average of $' + b.priceDollarsPerGallon + ' per gallon for the week of ' + longDate(b.observationDate) + '. '
        : 'Rate set by Integrity Cabinets for this week. ';
      show(foot, true);
    }

    renderLead(now);
    renderAnnouncements(now);
    clearTimeout(switchTimer);
    if (current && !demo) {
      // Switch to the new week at the cutoff even if the page was left open.
      var wait = Date.parse(current.effectiveEnd) - Date.now() + 1000;
      switchTimer = setTimeout(function () { render(); load(); }, Math.min(Math.max(wait, 1000), 2147000000));
    }
  }

  function addDays(d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function isDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d + 'T00:00:00Z')); }
  function mondayOf(d) { return addDays(d, -((new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7)); }
  function ordinal(d) {
    var p = parts(d), n = p.d, suffix = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
    return MONTHS[p.m - 1] + ' ' + n + suffix;
  }

  // Lead times roll forward 7 days every Monday from the dates saved for anchorWeek.
  function leadRows(lt, thisMonday) {
    if (!lt || !isDate(lt.anchorWeek) || !Array.isArray(lt.items) || lt.items.length === 0) return null;
    var weeks = Math.round(daysBetween(mondayOf(lt.anchorWeek), thisMonday) / 7);
    if (weeks < 0) weeks = 0;
    var rows = [];
    for (var i = 0; i < lt.items.length; i++) {
      var it = lt.items[i], text = null;
      if (!it || !it.label) return null;
      (lt.overrides || []).forEach(function (o) { if (o && o.week === thisMonday && o.label === it.label && o.value) text = String(o.value); });
      if (text === null) {
        if (it.type === 'day' && isDate(it.date)) text = ordinal(addDays(it.date, weeks * 7));
        else if (it.type === 'week' && isDate(it.weekOf)) {
          var start = addDays(mondayOf(it.weekOf), weeks * 7);
          text = 'Week of ' + ordinal(start) + ' – ' + ordinal(addDays(start, 4));
        } else return null;
      }
      rows.push([String(it.label), text]);
    }
    return rows;
  }

  function renderLead(now) {
    var box = $('icfs-lead'), list = $('icfs-lead-list'), asof = $('icfs-lead-asof');
    list.textContent = '';
    var old = box.querySelector('.icfs-lead-note'); if (old) old.remove();
    if (state.lead === null) { show(box, false); return; }
    var thisMonday = mondayOf(todayCentral(now));
    var rows = leadRows(state.lead, thisMonday);
    show(box, true);
    if (!rows) {
      asof.textContent = '';
      var note = document.createElement('p');
      note.className = 'icfs-lead-note';
      note.textContent = 'Please contact Customer Service for current lead times: ' + PHONE + '.';
      box.appendChild(note);
      return;
    }
    asof.textContent = '· week of ' + longDate(thisMonday);
    rows.forEach(function (r) {
      var row = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = r[0]; dd.textContent = r[1];
      row.appendChild(dt); row.appendChild(dd); list.appendChild(row);
    });
  }

  function renderAnnouncements(now) {
    var box = $('icfs-ann'), today = todayCentral(now);
    box.textContent = '';
    var active = ((state.ann && state.ann.announcements) || []).filter(function (a) {
      return a && typeof a.text === 'string' && a.text.trim() &&
        (!a.showFrom || (isDate(a.showFrom) && a.showFrom <= today)) &&
        (!a.showThrough || (isDate(a.showThrough) && today <= a.showThrough));
    }).slice(0, 3);
    if (active.length) {
      var h = document.createElement('h3'); h.className = 'icfs-label';
      h.textContent = active.length > 1 ? 'Announcements' : 'Announcement';
      box.appendChild(h);
      active.forEach(function (a) { var p = document.createElement('p'); p.textContent = a.text.trim(); box.appendChild(p); });
    }
    show(box, active.length > 0);
  }

  function getJson(name) {
    return fetch(DATA_URL + name + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); });
  }

  function load() {
    if (demo) { state.records = demo.records || []; state.lead = demo.lead === undefined ? false : demo.lead; state.ann = demo.ann || null; render(); return; }
    // If a refresh fails, whatever was last shown stays on screen.
    getJson('fuel-surcharge.json')
      .then(function (d) { if (d && Array.isArray(d.records)) state.records = d.records; else if (state.records === null) state.records = []; })
      .catch(function () { if (state.records === null) state.records = []; })
      .then(render);
    getJson('lead-times.json')
      .then(function (d) { state.lead = d; })
      .catch(function () { if (state.lead === null) state.lead = false; })
      .then(render);
    getJson('announcements.json')
      .then(function (d) { state.ann = d; })
      .catch(function () {})
      .then(render);
  }

  load();
  if (!demo) {
    setInterval(load, REFRESH_MINUTES * 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  }
})();
</script>
